<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Tumble Crown 3D — Party Knockout</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
window.TumbleNet = (function () {
  var peer = null;
  var conns = {};
  var hostConn = null;
  var queue = [];
  var currentCode = '';
  var isHost = false;
  var peerConfig = {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' }
      ]
    }
  };

  function pushEv(ev) { queue.push(ev); }

  function decodeB64(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }

  function cleanup() {
    Object.keys(conns).forEach(function (k) { try { conns[k].close(); } catch (e) {} });
    conns = {};
    if (hostConn) { try { hostConn.close(); } catch (e) {} hostConn = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    currentCode = '';
    isHost = false;
  }

  return {
    getInitialRoom: function () {
      try {
        var params = new URLSearchParams(window.location.search);
        return params.get('room') || '';
      } catch (e) { return ''; }
    },
    getInviteUrl: function () {
      return window.location.origin + window.location.pathname + '?room=' + encodeURIComponent(currentCode);
    },
    copyInviteUrl: function () {
      var u = this.getInviteUrl();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(u).catch(function () {});
      }
    },
    createRoom: function (code, name, skin) {
      cleanup();
      isHost = true;
      currentCode = String(code);
      if (typeof Peer === 'undefined') {
        pushEv({ type: 'error', message: 'Không tải được thư viện PeerJS!' });
        return;
      }
      peer = new Peer('tc3d-' + currentCode, peerConfig);
      peer.on('open', function () {
        pushEv({ type: 'created', code: currentCode });
      });
      peer.on('connection', function (conn) {
        conn.on('data', function (raw) {
          if (raw && raw.t === 'hello') {
            conns[conn.peer] = conn;
            pushEv({ type: 'peer_join', peerId: conn.peer, name: raw.name || 'Friend', skin: raw.skin || 1 });
          } else {
            pushEv({ type: 'msg', from: conn.peer, data: raw });
          }
        });
        conn.on('close', function () {
          delete conns[conn.peer];
          pushEv({ type: 'peer_leave', peerId: conn.peer });
        });
      });
      peer.on('error', function (err) {
        pushEv({ type: 'error', message: 'Lỗi tạo phòng: ' + (err.type || err.message || err) });
      });
    },
    joinRoom: function (code, name, skin) {
      cleanup();
      isHost = false;
      currentCode = String(code).trim();
      if (typeof Peer === 'undefined') {
        pushEv({ type: 'error', message: 'Không tải được thư viện PeerJS!' });
        return;
      }
      peer = new Peer(undefined, peerConfig);
      peer.on('open', function (myId) {
        hostConn = peer.connect('tc3d-' + currentCode, { reliable: false });
        hostConn.on('open', function () {
          hostConn.send({ t: 'hello', name: name, skin: skin });
          pushEv({ type: 'joined', peerId: myId });
        });
        hostConn.on('data', function (raw) {
          pushEv({ type: 'msg', from: 'host', data: raw });
        });
        hostConn.on('close', function () {
          pushEv({ type: 'disconnected' });
        });
        hostConn.on('error', function (err) {
          pushEv({ type: 'error', message: 'Không kết nối được phòng ' + currentCode });
        });
      });
      peer.on('error', function (err) {
        pushEv({ type: 'error', message: 'Lỗi vào phòng: ' + (err.type || err.message || err) });
      });
    },
    leaveRoom: function () { cleanup(); },
    sendToAllB64: function (b64) {
      if (!isHost) return;
      try {
        var obj = decodeB64(b64);
        Object.keys(conns).forEach(function (k) {
          if (conns[k] && conns[k].open) conns[k].send(obj);
        });
      } catch (e) {}
    },
    sendToHostB64: function (b64) {
      if (isHost || !hostConn || !hostConn.open) return;
      try { hostConn.send(decodeB64(b64)); } catch (e) {}
    },
    poll: function () {
      if (queue.length === 0) return '[]';
      var out = queue.splice(0, queue.length);
      return JSON.stringify(out);
    }
  };
})();
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":66244,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
